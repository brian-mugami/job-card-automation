[project]
name = "job-card-automation-system"
version = "0.1.0"
description = "Local-first job card automation system using FastAPI, Streamlit, and PostgreSQL."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.29.0",
    "email-validator>=2.1.1",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.1",
    "reportlab>=4.2.0",
    "sqlalchemy>=2.0.30",
    "streamlit>=1.35.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.ruff]
line-length = 100
